[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-novel-studio-frontend"
version = "0.1.0"
description = "AI Novel Studio modern QML/WebEngine frontend (standalone)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["ai_novel_studio"]
strict = true
ignore_missing_imports = true
